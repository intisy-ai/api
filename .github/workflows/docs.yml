name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    uses: intisy/workflows/.github/workflows/docs.yml@main
    with:
      # The manifest $schema URL points at the published site, so the schema ships with the
      # reference that documents it.
      extra_paths: 'schema/plugin.schema.json schema/plugin.schema.json'
